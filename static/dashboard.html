<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raala — Meeting Dashboard</title>
  <meta name="theme-color" content="#f3f5ff" />
  <link rel="stylesheet" href="/static/styles.css?v=18" />
  <style>
    .dash { width: min(100% - 2rem, 960px); margin: 0 auto; padding: 1.5rem 0 3rem; }
    .dash-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .dash-head h1 { margin: 0; font-size: 1.4rem; }
    .dash-head p { margin: 0.2rem 0 0; color: #78849b; font-size: 0.85rem; }
    .dash-actions { display: flex; gap: 0.6rem; }
    .dash-btn { min-height: 38px; padding: 0 1rem; border-radius: 999px; border: 1px solid #e1e5ef; background: #fff; color: #3459c9; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .dash-btn.primary { border: 0; background: #3459c9; color: #fff; }
    .cancel-btn { margin-top: 0.6rem; color: #b04469; border-color: #efc3d2; }
    .cancel-btn:hover { border-color: #b04469; }
    .cancel-btn:disabled { opacity: 0.6; cursor: wait; }
    .sheet-card { margin: 1rem 0; padding: 0.8rem 1rem; border: 1px solid #e1e5ef; border-radius: 14px; background: #fff; font-size: 0.85rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.8rem; }
    .bcard { border: 1px solid #e1e5ef; border-radius: 16px; background: #fff; padding: 0.9rem 1rem; box-shadow: 0 8px 22px rgb(65 91 151 / 8%); }
    .bcard h2 { margin: 0 0 0.3rem; font-size: 0.95rem; }
    .bcard .meta { color: #7a86a0; font-size: 0.78rem; margin-bottom: 0.4rem; }
    .bcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.6rem; font-size: 0.8rem; }
    .bcard dt { color: #7a86a0; }
    .bcard dd { margin: 0; color: #2f3a52; overflow-wrap: anywhere; }
    .idpill { display: inline-block; padding: 0.1rem 0.55rem; border-radius: 999px; background: #f2f5ff; color: #3459c9; font-family: ui-monospace, monospace; font-size: 0.75rem; font-weight: 700; }
    .empty { padding: 2rem 1rem; text-align: center; color: #7a86a0; border: 1px dashed #cfd6e6; border-radius: 16px; background: #fff; }
    .error-message { margin-top: 1rem; }
  </style>
</head>
<body>
  <main class="dash">
    <div class="dash-head">
      <div>
        <h1>Meeting dashboard</h1>
        <p id="dash-count">Loading bookings…</p>
      </div>
      <div class="dash-actions">
        <a class="dash-btn" href="/">Back to Raala</a>
        <button class="dash-btn" id="dash-purge" type="button">Clear cancelled</button>
        <button class="dash-btn primary" id="dash-refresh" type="button">Refresh</button>
      </div>
    </div>
    <div class="sheet-card" id="sheet-card" hidden></div>
    <div class="cards" id="booking-cards"></div>
    <p id="dash-error" class="error-message" role="alert" hidden></p>
  </main>
  <script>
    const cardsEl = document.getElementById("booking-cards");
    const countEl = document.getElementById("dash-count");
    const sheetEl = document.getElementById("sheet-card");
    const errorEl = document.getElementById("dash-error");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function renderSheet(info) {
      sheetEl.hidden = false;
      if (info && info.configured && info.url) {
        sheetEl.innerHTML = `Google Sheet${info.sheet_name ? ` (${esc(info.sheet_name)})` : ""}: <a href="${esc(info.url)}" target="_blank" rel="noopener">Open spreadsheet</a>`;
      } else {
        sheetEl.textContent = "Google Sheets is not configured — bookings are kept in the local record.";
      }
    }

    function renderBookings(bookings) {
      cardsEl.innerHTML = "";
      if (!bookings.length) {
        cardsEl.innerHTML = `<div class="empty">No meetings booked yet. Ask Raala to schedule one.</div>`;
      }
      for (const b of bookings) {
        const card = document.createElement("article");
        card.className = "bcard";
        const cancelled = String(b.status || "").startsWith("cancelled");
        card.innerHTML = `
          <h2>${esc(b.topic || "Meeting")}</h2>
          <div class="meta">${esc(b.meeting_date || "")} · ${esc(b.meeting_time || "")} ${esc(b.timezone || "")}</div>
          <div class="meta"><span class="idpill">${esc(b.booking_id || "")}</span></div>
          <dl>
            <dt>Name</dt><dd>${esc(b.name || "")}</dd>
            <dt>Email</dt><dd>${esc(b.email || "")}</dd>
            ${b.phone ? `<dt>Phone</dt><dd>${esc(b.phone)}</dd>` : ""}
            <dt>Type</dt><dd>${esc(b.meeting_type || "")}</dd>
            ${b.notes ? `<dt>Notes</dt><dd>${esc(b.notes)}</dd>` : ""}
            <dt>Status</dt><dd>${esc(b.status || "")}</dd>
            ${b.calendar ? `<dt>Calendar</dt><dd>${esc(b.calendar)}</dd>` : ""}
            ${b.mail ? `<dt>Mail</dt><dd>${esc(b.mail)}</dd>` : ""}
            ${b.sheets ? `<dt>Sheet</dt><dd>${esc(b.sheets)}</dd>` : ""}
          </dl>
          ${cancelled ? `<div class="meta">Cancelled — slot freed.</div>` : `<button class="dash-btn cancel-btn" type="button" data-cancel-id="${esc(b.booking_id || "")}">Cancel booking</button>`}`;
        cardsEl.append(card);
      }
      countEl.textContent = bookings.length === 1 ? "1 meeting booked" : `${bookings.length} meetings booked`;
    }

    async function load() {
      errorEl.hidden = true;
      try {
        const [bookingsRes, sheetRes] = await Promise.all([
          fetch("/api/meetings/bookings"),
          fetch("/api/meetings/sheets-link"),
        ]);
        if (!bookingsRes.ok) throw new Error(`Bookings failed (HTTP ${bookingsRes.status}).`);
        const payload = await bookingsRes.json();
        renderBookings(Array.isArray(payload.bookings) ? payload.bookings : []);
        if (sheetRes.ok) renderSheet(await sheetRes.json());
        else renderSheet(null);
      } catch (error) {
        errorEl.textContent = error instanceof Error ? error.message : "Dashboard could not load.";
        errorEl.hidden = false;
        countEl.textContent = "Bookings unavailable";
      }
    }

    document.getElementById("dash-refresh").addEventListener("click", load);
    document.getElementById("dash-purge").addEventListener("click", async () => {
      if (!window.confirm("Delete all cancelled bookings from the local log? Calendar events already removed stay removed.")) return;
      errorEl.hidden = true;
      try {
        const result = await fetch("/api/meetings/bookings?only=cancelled", { method: "DELETE" });
        const body = await result.json().catch(() => ({}));
        if (!result.ok) throw new Error(body.detail || `Purge failed (HTTP ${result.status}).`);
        countEl.textContent = `Cleared ${body.removed || 0} cancelled booking(s).`;
        await load();
      } catch (error) {
        errorEl.textContent = error instanceof Error ? error.message : "Purge failed.";
        errorEl.hidden = false;
      }
    });
    cardsEl.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-cancel-id]");
      if (!button) return;
      const id = button.getAttribute("data-cancel-id");
      if (!id || !window.confirm(`Cancel booking ${id}? This frees the slot and removes the calendar event.`)) return;
      button.disabled = true;
      try {
        const result = await fetch(`/api/meetings/bookings/${encodeURIComponent(id)}`, { method: "DELETE" });
        const body = await result.json().catch(() => ({}));
        if (!result.ok) throw new Error(body.detail || `Cancel failed (HTTP ${result.status}).`);
        await load();
        if (body.calendar && body.calendar !== "calendar event deleted" && body.calendar !== "no calendar event stored" && body.calendar !== "already cancelled") {
          errorEl.textContent = body.calendar;
          errorEl.hidden = false;
        }
      } catch (error) {
        errorEl.textContent = error instanceof Error ? error.message : "Cancel failed.";
        errorEl.hidden = false;
        button.disabled = false;
      }
    });
    load();
  </script>
</body>
</html>
