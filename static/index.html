<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice-Pilot — Your Voice Assistant</title>
  <meta name="theme-color" content="#f3f5ff" />
  <link rel="stylesheet" href="/static/styles.css?v=12" />
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Voice-Pilot home">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Raala</span>
      </a>
      <span class="connection"><span id="connection-dot"></span><span id="connection-label">Connecting</span></span>
    </header>

    <section class="voice-stage" aria-labelledby="app-name">
      <h1 id="app-name">Voice-Pilot</h1>
      <p id="agent-status" role="status" aria-live="polite" data-state="idle">Hello there! I'm Raala, your Voice-Pilot assistant. Tap the microphone and start speaking.</p>

      <div id="avatar" class="avatar" data-state="idle" data-emotion="calm" role="img" aria-label="Voice-Pilot is idle">
        <div class="avatar-halo"></div>
        <div class="avatar-orbit avatar-orbit-one" aria-hidden="true"></div>
        <div class="avatar-orbit avatar-orbit-two" aria-hidden="true"></div>
        <svg class="face" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="faceGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f8fbff" />
              <stop offset="1" stop-color="#dfeaff" />
            </linearGradient>
            <linearGradient id="cheekGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#a7c3ff" stop-opacity=".85" />
              <stop offset="1" stop-color="#d7e5ff" stop-opacity=".2" />
            </linearGradient>
          </defs>
          <path class="face-shape" d="M120 16c-48 0-84 34-84 88v27c0 52 35 91 84 91s84-39 84-91v-27c0-54-36-88-84-88Z" fill="url(#faceGradient)" />
          <path class="face-shine" d="M61 79c11-28 33-43 59-43" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="7" opacity=".8" />
          <g class="hat" transform="rotate(-6 120 70)">
            <ellipse cx="120" cy="80" rx="88" ry="15" fill="#c08a4e" stroke="#8a5a30" stroke-width="2.5" />
            <path d="M78 80 C 78 48, 90 34, 106 34 C 112 34, 115 37, 120 37 C 125 37, 128 34, 134 34 C 150 34, 162 48, 162 80 Z" fill="#c08a4e" stroke="#8a5a30" stroke-width="2.5" />
            <path d="M83 62 C 100 58, 140 58, 157 62 L157 73 C 140 69, 100 69, 83 73 Z" fill="#5d3f26" />
          </g>
          <ellipse cx="70" cy="145" rx="20" ry="10" fill="url(#cheekGradient)" />
          <ellipse cx="170" cy="145" rx="20" ry="10" fill="url(#cheekGradient)" />
          <g class="eyes eye-default">
            <g class="eye">
              <ellipse cx="83" cy="115" rx="13" ry="15" fill="#ffffff" />
              <circle cx="83" cy="116" r="7" fill="#5478e8" />
              <circle cx="83" cy="116" r="3.5" fill="#243653" />
              <circle cx="80.5" cy="113.5" r="2" fill="#ffffff" />
            </g>
            <g class="eye">
              <ellipse cx="157" cy="115" rx="13" ry="15" fill="#ffffff" />
              <circle cx="157" cy="116" r="7" fill="#5478e8" />
              <circle cx="157" cy="116" r="3.5" fill="#243653" />
              <circle cx="154.5" cy="113.5" r="2" fill="#ffffff" />
            </g>
          </g>
          <g class="eyes eye-alt eye-wink">
            <ellipse cx="83" cy="115" rx="13" ry="15" fill="#ffffff" />
            <circle cx="83" cy="116" r="7" fill="#5478e8" />
            <circle cx="83" cy="116" r="3.5" fill="#243653" />
            <circle cx="80.5" cy="113.5" r="2" fill="#ffffff" />
            <path d="M144 114 Q157 120 170 114" fill="none" stroke="#243653" stroke-width="4" stroke-linecap="round" />
          </g>
          <g class="eyes eye-alt eye-sleepy">
            <path d="M70 114 Q83 121 96 114" fill="none" stroke="#243653" stroke-width="4" stroke-linecap="round" />
            <path d="M144 114 Q157 121 170 114" fill="none" stroke="#243653" stroke-width="4" stroke-linecap="round" />
          </g>
          <path class="mouth mouth-calm" d="M101 154c7 9 17 13 27 13s20-4 27-13" fill="none" stroke="#5978b4" stroke-linecap="round" stroke-width="5" />
          <path class="mouth mouth-joyful" d="M100 151c8 12 18 17 28 17s20-5 28-17c-2 17-11 25-28 25s-26-8-28-25Z" fill="#5978b4" />
          <path class="mouth mouth-caring" d="M103 160c8-6 16-9 25-9s17 3 25 9" fill="none" stroke="#5978b4" stroke-linecap="round" stroke-width="5" />
          <path class="mouth mouth-curious" d="M108 159c5-3 10-4 15-4" fill="none" stroke="#5978b4" stroke-linecap="round" stroke-width="5" />
          <path class="mouth mouth-success" d="M99 151c9 14 20 20 29 20s20-6 29-20c-2 19-12 29-29 29s-27-10-29-29Z" fill="#5978b4" />
          <path class="mouth mouth-error" d="M103 165c8-7 16-10 25-10s17 3 25 10" fill="none" stroke="#d85d78" stroke-linecap="round" stroke-width="5" />
          <path class="mustache mustache-left" d="M120 147 C 112 143, 102 143, 94 148" />
          <path class="mustache mustache-right" d="M120 147 C 128 143, 138 143, 146 148" />
          <path class="mouth mouth-playful" d="M99 159 C 111 165, 129 163, 141 151" fill="none" stroke="#5978b4" stroke-linecap="round" stroke-width="5" />
          <ellipse class="mouth mouth-surprised" cx="120" cy="162" rx="9" ry="11" fill="#5978b4" />
          <path class="mouth mouth-sleepy" d="M110 161 C 115 163, 125 163, 130 161" fill="none" stroke="#5978b4" stroke-linecap="round" stroke-width="4" />
          <path class="mouth mouth-sad" d="M100 169 C 108 156, 132 156, 140 169" fill="none" stroke="#5978b4" stroke-linecap="round" stroke-width="5" />
          <path d="M105 206c8 5 17 7 27 7s19-2 27-7" fill="none" stroke="#aac4f6" stroke-linecap="round" stroke-width="3" opacity=".8" />
        </svg>
        <div class="sound-rings" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>

      <div class="controls">
        <button id="microphone-button" class="mic-button" type="button" aria-pressed="false" aria-label="Start listening">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"></rect><path d="M5.5 11.5v1a6.5 6.5 0 0 0 13 0v-1M12 19v3M9 22h6"></path></svg>
        </button>
        <button id="stop-response" class="interrupt-button" type="button" disabled>Stop response</button>
      </div>
      <div class="audio-indicator"><span id="audio-dot"></span><span id="audio-label">MMS English voice replies on</span><button id="enable-audio" class="enable-audio" type="button" hidden>Enable voice</button></div>
      <p id="error-message" class="error-message" role="alert" hidden></p>
    </section>

    <footer><span>Private on this device</span><span>Speech recognition &amp; AI require an internet connection</span></footer>
  </main>

  <script src="/static/app.js?v=29"></script>
</body>
</html>
